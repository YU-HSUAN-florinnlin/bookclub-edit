<title>讀書會剪輯工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --sunken:#E3E8ED;
  --ink:#17212B; --ink-2:#4B5664; --ink-3:#7A8592; --line:#D3DAE1;
  --accent:#136B60; --accent-ink:#FFFFFF; --accent-soft:#D9EDE8;
  --ai:#3F4FB8; --ai-soft:#E2E5F7;
  --teacher:#8F5600; --teacher-soft:#F5E7D2;
  --warn:#B42318; --warn-soft:#FBE3DF; --ok:#25733A; --ok-soft:#DDF0E1;
  --font-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --surface:#151C23; --surface-2:#1A222B; --sunken:#0B0F13;
    --ink:#E3E8ED; --ink-2:#A3AEBA; --ink-3:#75818E; --line:#28323D;
    --accent:#4CB5A3; --accent-ink:#062520; --accent-soft:#15332E;
    --ai:#95A1F5; --ai-soft:#1F2550; --teacher:#E3AA56; --teacher-soft:#33260F;
    --warn:#F08A7D; --warn-soft:#3B1C19; --ok:#6CC484; --ok-soft:#173222;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#151C23; --surface-2:#1A222B; --sunken:#0B0F13;
  --ink:#E3E8ED; --ink-2:#A3AEBA; --ink-3:#75818E; --line:#28323D;
  --accent:#4CB5A3; --accent-ink:#062520; --accent-soft:#15332E;
  --ai:#95A1F5; --ai-soft:#1F2550; --teacher:#E3AA56; --teacher-soft:#33260F;
  --warn:#F08A7D; --warn-soft:#3B1C19; --ok:#6CC484; --ok-soft:#173222;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.top{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:18px 6px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:.02em}
.sample{font-size:12px;letter-spacing:.06em;padding:2px 10px;border-radius:999px;background:var(--teacher-soft);color:var(--teacher);font-weight:700}
.topright{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.who-pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.who-ai{background:var(--ai-soft);color:var(--ai)}
.who-partner{background:var(--accent-soft);color:var(--accent)}
.who-teacher{background:var(--teacher-soft);color:var(--teacher)}
select.who-select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px}

.app{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:14px 60px;display:grid;grid-template-columns:236px minmax(0,1fr) 300px;gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
.rail-item{display:grid;grid-template-columns:26px 1fr;gap:2px 8px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px}
.rail-item:hover{background:var(--surface-2)}
.rail-item.is-on{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.rail-num{font-family:var(--font-mono);font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--ink-2);grid-row:span 2}
.rail-item.is-done .rail-num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.rail-name{font-weight:500;font-size:14px;line-height:1.3}
.rail-who{display:flex;gap:4px;flex-wrap:wrap}
.rail-who .who-pill{font-size:11px;padding:0 7px}
.rail-sep{height:1px;background:var(--line);margin:8px 10px}
.rail-foot{display:flex;flex-direction:column;gap:6px;padding:4px 10px;font-size:13px}
.linkish{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-align:left}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head .eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.page-head h2{font-family:var(--font-display);font-size:26px;font-weight:700}
.page-head p{margin:0;color:var(--ink-2);max-width:68ch}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.note b{color:var(--ink)}
.warn-note{background:var(--warn-soft);color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;line-height:1.4}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ai{background:var(--ai);border-color:var(--ai);color:var(--surface);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}

.play{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:2px 11px 2px 9px;font-size:13px;white-space:nowrap}
.play::before{content:"";width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.play.is-playing{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.play.is-playing::before{width:8px;height:10px;border:0;border-left:3px solid currentColor;border-right:3px solid currentColor}
.play.after{border-color:var(--accent)}

.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 14px;padding:14px 4px;border-top:1px solid var(--line);align-items:start}
.flow li:first-child{border-top:0}
.flow .n{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--ink-3);text-align:center;padding-top:2px}
.flow h3{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.flow .time{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.flow .time b{display:block;color:var(--ink);font-weight:500}
.flow button.open{margin-top:6px}

.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.split > div{border-radius:8px;padding:12px 14px;background:var(--surface-2)}
.split h4{margin:0 0 4px;font-size:14px}
.split p{margin:0;font-size:13px;color:var(--ink-2)}
.split .big{font-size:20px;font-weight:700;color:var(--ink);font-family:var(--font-display)}

.alts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.alt{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.alt.is-picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.alt h4{margin:0;font-size:15px;display:flex;gap:8px;align-items:baseline}
.alt h4 .tag{font-family:var(--font-display);font-size:20px;color:var(--ink-3)}
.alt .seq{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:6px 8px}
.alt ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.alt label{font-size:13px;display:flex;gap:6px;align-items:center;margin-top:auto}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--ink-2);font-size:14px}
.tab.is-on{border-bottom-color:var(--accent);color:var(--ink);font-weight:500}
.tab .count{font-family:var(--font-mono);font-size:12px;margin-left:4px;color:var(--ink-3)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.04em}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.card h4{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .sub{font-size:13px;color:var(--ink-2)}
.card.is-set{border-color:var(--ok)}
.conf{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.conf-bar{flex:1;height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.conf-bar i{display:block;height:100%;background:var(--ai)}
.conf-bar.low i{background:var(--teacher)}
.guess{font-size:13px;background:var(--ai-soft);border-radius:6px;padding:8px 10px;color:var(--ink)}
.guess b{color:var(--ai)}
select.assign{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

.rate{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.dots{display:flex;gap:3px}
.dot{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-family:var(--font-mono);padding:0}
.dot.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.reveal{font-size:13px;background:var(--teacher-soft);color:var(--teacher);border-radius:6px;padding:6px 10px}

.steps-sim{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps-sim li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.steps-sim .st{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.steps-sim li.is-run .st{border-color:var(--ai);border-top-color:transparent;animation:spin .8s linear infinite}
.steps-sim li.is-done .st{background:var(--ok);border-color:var(--ok)}
.steps-sim .est{font-size:12px;color:var(--ink-3);white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai);transition:width .3s}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.summary div{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.summary b{display:block;font-size:22px;color:var(--ink);font-family:var(--font-display)}

.keys{font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.progress .bar{flex:1;max-width:260px}
.progress .bar i{background:var(--accent)}

.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.item.is-sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item.is-done{background:var(--surface-2)}
.item-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.item-head .t{font-family:var(--font-mono);color:var(--ink);font-size:13px}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip-ai{background:var(--ai-soft);color:var(--ai)}
.chip-t{background:var(--teacher-soft);color:var(--teacher)}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
textarea.txt{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);line-height:1.7}
.hint-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.hint-row .lbl{color:var(--ink-2)}
.fix-btn{border:1px dashed var(--ai);background:var(--ai-soft);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:13px}
.fix-btn s{color:var(--ink-3)}
.name-btn{border:1px dashed var(--teacher);background:var(--teacher-soft);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:13px}
.sent{font-size:15px;line-height:1.8}
.sent mark{background:var(--teacher-soft);color:var(--teacher);border-radius:4px;padding:0 3px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--surface)}
.opt.is-on{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt small{display:block;color:var(--ink-2);font-size:12.5px}
.opt .ai-tag{font-size:11px;color:var(--ai);font-weight:700;margin-left:6px}
.sub-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair label{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.muted-item{opacity:.75}
.del-row{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:8px;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.del-row input{width:96px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--font-mono);font-size:13px}

.ba{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fit{font-size:13px;border-radius:6px;padding:6px 10px}
.fit.ok{background:var(--ok-soft);color:var(--ok)}
.fit.info{background:var(--ai-soft);color:var(--ai)}
.fit.warn{background:var(--warn-soft);color:var(--warn)}
.decide{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.decide input{flex:1;min-width:180px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.btn.is-on-ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.is-on-warn{background:var(--warn);border-color:var(--warn);color:var(--surface)}

.player{display:flex;flex-direction:column;gap:12px}
.pl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pl-time{font-family:var(--font-mono);font-size:14px}
.speed{display:flex;gap:4px}
.speed .btn{padding:4px 10px;font-size:13px}
.speed .btn.is-on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timeline{position:relative;height:54px;background:var(--sunken);border-radius:8px;cursor:pointer;overflow:hidden}
.timeline .wave{position:absolute;inset:14px 0;display:flex;align-items:center;gap:2px;padding:0 6px;pointer-events:none}
.timeline .wave i{flex:1;background:var(--line);border-radius:1px}
.mk{position:absolute;top:0;bottom:0;width:3px;border:0;padding:0;margin-left:-1px}
.mk::after{content:"";position:absolute;left:-5px;top:-1px;width:13px;height:13px;border-radius:50%;background:inherit}
.mk-name{background:var(--teacher)}
.mk-stu{background:var(--accent)}
.mk-ovl{background:var(--ai)}
.mk-del{background:var(--warn)}
.mk-fix{background:var(--ink)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);pointer-events:none}
.mk-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.mk-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
.report{font-family:var(--font-mono);font-size:13px;background:var(--surface-2);border-radius:8px;padding:12px 14px;white-space:pre-wrap;line-height:1.7}

.fb{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
.fb h3{font-size:15px}
.fb .desc{font-size:13px;color:var(--ink-2);margin:0}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px}
.fchip.is-on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fb textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:14px}
.fb-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.fb-rec{font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.fb-rec .meta{font-size:11.5px;color:var(--ink-3)}
.store-note{font-size:12px;color:var(--ink-3)}
textarea.export{width:100%;min-height:160px;font-family:var(--font-mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2)}

.to-fb{display:none;position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:9;border-radius:999px;padding:9px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (max-width:1180px){ .to-fb{display:inline-flex} }
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.is-on{opacity:1}

@media (max-width:1180px){
  .app{grid-template-columns:210px minmax(0,1fr)}
  .fb-col{grid-column:2}
  .fb{position:static}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);padding-inline:16px}
  .top{padding-inline:16px}
  .fb-col{grid-column:1}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .rail-item{grid-template-columns:24px auto;min-width:max-content}
  .rail-who,.rail-sep,.rail-foot{display:none}
  .split,.alts,.pair{grid-template-columns:minmax(0,1fr)}
  .flow li{grid-template-columns:32px minmax(0,1fr)}
  .flow .time{grid-column:2;text-align:left}
  .del-row{grid-template-columns:1fr 1fr;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<header class="top">
  <div class="brand">
    <h1>讀書會剪輯工作台</h1>
    <span class="sample">樣品：資料和聲音都是假的</span>
  </div>
  <div class="topright">
    <div class="legend">
      <span class="who-pill who-ai">電腦</span>
      <span class="who-pill who-partner">夥伴</span>
      <span class="who-pill who-teacher">老師</span>
    </div>
    <label for="who">你是
      <select id="who" class="who-select">
        <option value="">（選一下）</option>
        <option>宇軒</option>
        <option>夥伴</option>
        <option>老師</option>

function play(id){
  if (!id) return;

}

function reviewItems(){
  const out = [];
  S.fixes.forEach(f => out.push({id:f.id, kind:"修補", t:f.t, note:f.note, fix:true, sort:f.sec}));
  NAMES.forEach(n => { const m = S.names[n.id].method; out.push({id:"r_"+n.id, kind:"名字", t:n.t, before:n.clip, after:n.out[m], teacher:true, label:(m==="name"?"只換名字":"整句換掉")+`：${n.name} → ${n.code}`}); });
  const om = S.ovl.method;
  out.push({id:"r_o1", kind:"重疊", t:OVL.t, before:OVL.clip, after:OVL.out[om], method:om, label:OVL_OPTS.find(x => x.v===om).label});
  SEGS.forEach(g => out.push({id:"r_"+g.id, kind:"學員重念", t:g.t, before:g.id, after:"p"+g.id.slice(1), label:`${spkLabel(g.spk)} → ${voiceOfSpk(g.spk)}`}));
  const toSec = t => { const p = String(t).split(":").map(Number); return p.length===3 ? p[0]*3600+p[1]*60+p[2] : 0; };
  return out.sort((a,b) => (a.fix?-1:0) - (b.fix?-1:0) || toSec(a.t) - toSec(b.t));
}
function fitInfo(it){
  if (it.kind === "重疊"){
    if (it.method === "drop") return {c:"info", t:"聲音和畫面一起剪掉 2 秒，畫面會跳一下"};
    if (it.method === "seq") return {c:"warn", t:`影片變長 ${(DUR[it.after]-DUR[it.before]).toFixed(1)} 秒，用畫面停格補（停格時老師的嘴不會動）`};
    return {c:"ok", t:"長度跟原本差不多"};
  }
  if (!it.before || !it.after) return null;
  const d = (DUR[it.after] - DUR[it.before]) / DUR[it.before], pct = Math.round(Math.abs(d)*100);
  if (it.teacher){
    return Math.abs(d) > .15 ? {c:"warn", t:`老師的句子${d<0?"短":"長"}了 ${pct}%，畫面上的嘴型可能對不上`} : {c:"ok", t:"長度差不多，嘴型對得上"};
  }
  if (d < -.03) return {c:"ok", t:`短了 ${pct}%，後面補靜音`};
  if (d <= .03) return {c:"ok", t:"長度幾乎一樣"};
  if (d <= .15) return {c:"info", t:`長了 ${pct}%，稍微調快語速`};
  return {c:"warn", t:`長了 ${pct}%，用畫面停格補`};
}

        `<div class="ba">${playBtn(it.before, "處理前")}${it.after ? playBtn(it.after, "處理後", "after") : `<span class="chip">處理後：沒有聲音（整段剪掉）</span>`}</div>`}
      ${fit ? `<div class="fit ${fit.c}">${fit.t}</div>` : ""}
      <div class="decide"><button class="btn ${r.status==="ok"?"is-on-ok":""}" data-rv="${it.id}" data-s="ok">接受</button>
        <button class="btn ${r.status==="redo"?"is-on-warn":""}" data-rv="${it.id}" data-s="redo">退回重做</button>
        ${r.status==="redo" ? `<input data-rv-note="${it.id}" value="${esc(r.note)}" placeholder="說一句怎麼改，例如：念慢一點、Bella 的發音不對" aria-label="退回原因">` : ""}</div></div>`;
  }).join("");
  return `<section class="panel" style="display:flex;flex-direction:column;gap:14px">${head(st)}
    <div class="note">紅色的是電腦自己判斷可能有問題的地方，請優先聽。退回的項目只重做那一筆，其他不動。</div>
    <div class="progress"><span>已決定 ${decided} / ${items.length} 筆</span><span class="bar"><i style="width:${decided/items.length*100}%"></i></span></div>
    <div class="keys"><span><kbd>j</kbd>／<kbd>k</kbd> 下一筆／上一筆</span><span><kbd>p</kbd> 處理後</span><span><kbd>o</kbd> 處理前</span><span><kbd>a</kbd> 接受</span><span><kbd>r</kbd> 退回</span></div>
    <div class="items">${rows}</div>${nextRow("s6")}</section>`;
};

function finalMarks(){
  let t = 0; const m = [];
  FINAL_SEQ.forEach(([id, kind, label]) => {
    if (kind) m.push({t, kind, label});
    if (id === "p12") m.push({t: t, kind:"del", label:"刪除點：00:43:05–00:43:40（35 秒）"});
    t += DUR[id] + DUR.gap;
  });
  return m;
}
V.s7 = () => {
  const st = stepOf("s7");
  const marks = finalMarks(), tot = DUR.final;
  const bars = Array.from({length:90}, (_, i) => `<i style="height:${20 + Math.round(Math.abs(Math.sin(i*1.7) * Math.cos(i*.37)) * 80)}%"></i>`).join("");
  const mk = marks.map(x => `<button class="mk mk-${x.kind==="name"?"name":x.kind==="stu"?"stu":x.kind==="ovl"?"ovl":"del"}" style="left:${x.t/tot*100}%;${x.kind==="del"?"transform:translateX(6px)":""}" data-seek="${x.t}" title="${esc(x.label)}" aria-label="${esc(x.label)}"></button>`).join("")
    + S.fixes.map(f => `<button class="mk mk-fix" style="left:${f.sec/tot*100}%" data-seek="${f.sec}" aria-label="修補項目"></button>`).join("");
  const counts = `學員重念 ${SEGS.length} 段・名字 ${NAMES.length} 處・重疊 1 處・刪除 ${S.dels.length} 段・修補 ${S.fixes.length} 筆`;
  return `<section class="panel" style="display:flex;flex-direction:column;gap:14px">${head(st)}
    <div class="note">這裡放的是 52 秒的樣品片段（原片 00:41:02 起，已經剪掉中間 35 秒）。實際要看完整支成品，用 1.25–1.5 倍速約 1.5 小時。</div>
    <div class="player">
      <audio id="finalAudio" src="audio/final.mp3" preload="metadata"></audio>
      <div class="pl-row"><button class="btn btn-primary" data-act="toggleFinal" id="plBtn">播放</button>
        <span class="pl-time" id="plTime">00:00 / ${fmt(tot)}</span>
        <span class="speed">${[1,1.25,1.5].map(r => `<button class="btn ${S.rate===r||(!S.rate&&r===1)?"is-on":""}" data-rate-final="${r}">${r}×</button>`).join("")}</span>
        <button class="btn" data-act="flag">這裡有問題</button></div>
      <div class="timeline" id="tl" role="slider" aria-label="成品時間軸" aria-valuemin="0" aria-valuemax="${tot}" tabindex="0"><div class="wave">${bars}</div>${mk}<div class="playhead" id="ph" style="left:0"></div></div>
      <div class="mk-legend"><span style="--c:var(--teacher)">名字</span><span style="--c:var(--accent)">學員重念</span><span style="--c:var(--ai)">重疊</span><span style="--c:var(--warn)">刪除點</span><span style="--c:var(--ink)">你回報的問題</span></div>
      ${flagOpen ? `<div class="decide"><input id="flagNote" placeholder="什麼問題？例如：這裡老師的聲音突然變了" aria-label="問題說明"><button class="btn btn-primary" data-act="flagSave">建立修補項目</button><button class="btn" data-act="flagCancel">取消</button></div>` : ""}
      ${S.fixes.length ? `<div class="note">已建立 ${S.fixes.length} 筆修補項目，會出現在第 6 步最上面。<button class="linkish" data-go="s6">去第 6 步處理</button></div>` : ""}
    </div>
    <div class="btn-row"><button class="btn btn-primary" data-act="export">確認輸出</button></div>
    ${S.exported ? `<div class="report">輸出完成（樣品）
成品：第4週_隱私處理版.mp4
處理紀錄：report.md
${counts}
每一筆的「處理前／處理後」與耗時，都記在 report.md。</div>` : ""}
    ${nextRow("s7")}</section>`;
};
let flagOpen = false;

/* ── 右側回饋 ───────────────────────────────────── */
let fbDb = null, fbAll = [], fbSource = "local";
function localFb(){ try{ return JSON.parse(localStorage.getItem(KEY+"-fb") || "[]"); }catch(e){ return []; } }
function saveLocalFb(rec){ const a = localFb(); a.unshift(rec); try{ localStorage.setItem(KEY+"-fb", JSON.stringify(a)); }catch(e){} fbAll = a; }
function viewName(v){ return v==="home" ? "流程總覽／順序" : v==="order" ? "順序的其他排法" : (stepOf(v) ? `第 ${stepOf(v).n} 步・${stepOf(v).name}` : v); }
function fbText(rec){ const d = new Date(rec.at); return `【${viewName(rec.view)}】${rec.chips && rec.chips.length ? "感覺：" + rec.chips.join("、") + "。" : ""}${rec.order && rec.order.length ? "想試的排法：" + rec.order.join("、") + "。" : ""}${rec.note ? "說明：" + rec.note : ""}（${rec.who || "未填"}，${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}）`; }
function renderFb(){
  const v = S.view, d = S.fbDraft[v] || {chips:[], note:""};
  const mine = fbAll.filter(r => r.view === v);
  const isHome = v === "home";
  $("#fb").innerHTML = `<h3>${isHome ? "對整體流程或排法的感覺" : "這一步的感覺"}</h3>
    <p class="desc">${isHome ? "勾了「其他排法」的話，會一起送出。" : "點選一個或多個，再寫一句原因。"}</p>
    <div class="fchips">${FEEL.map(f => `<button class="fchip ${d.chips.includes(f)?"is-on":""}" data-feel="${f}" aria-pressed="${d.chips.includes(f)}">${f}</button>`).join("")}</div>
    <label for="fbNote" class="desc">哪裡怪？想怎麼改？</label>
    <textarea id="fbNote" placeholder="例如：刪除段落應該在校對之前決定">${esc(d.note)}</textarea>
    <button class="btn btn-primary" data-act="sendFb">送出</button>
    <span class="store-note">${fbDb ? "送出後我（Claude）讀得到。" : "目前存在這台電腦的瀏覽器；到流程總覽最下面可以複製全部回饋。"}</span>
    ${mine.length ? `<div class="fb-list">${mine.map(r => `<div class="fb-rec">${esc(fbText(r))}</div>`).join("")}</div>` : ""}`;
  const list = $("#allfbList");
  if (list){
    list.innerHTML = fbAll.length ? fbAll.map(r => `<div class="fb-rec">${esc(fbText(r))}</div>`).join("") : `<div class="store-note">還沒有回饋。</div>`;
    const ex = $("#exportText"); if (ex) ex.value = fbAll.slice().reverse().map(fbText).join("\n");
  }
}
async function sendFb(){
  const v = S.view, d = S.fbDraft[v] || {chips:[], note:""};
  const order = v === "home" ? S.order.slice() : [];
  if (!d.chips.length && !d.note.trim() && !order.length){ toast("先點一個感覺，或寫幾個字"); return; }
  const rec = {view:v, chips:d.chips, note:d.note.trim(), order, who:S.who || "", at:Date.now()};
  let ok = false;
  if (fbDb){ try{ await fbDb.collection("feedback").add(rec); ok = true; }catch(e){ ok = false; } }
  if (!ok) saveLocalFb(rec);
  S.fbDraft[v] = {chips:[], note:""}; save(); renderFb(); toast("已送出");
}
(async function connectDb(){
  fbAll = localFb();
  try{
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db) return;
    fbDb = db;
    db.collection("feedback").orderBy("at", "desc").limit(500).onSnapshot(snap => {
      const remote = snap.docs.map(x => x.data());
      fbAll = remote.concat(localFb()).sort((a,b) => b.at - a.at);
      renderFb(); if (S.view === "home") render();
    }, () => { fbDb = null; renderFb(); });
    renderFb();
  }catch(e){ fbDb = null; }
})();

/* ── 繪製 ───────────────────────────────────────── */
function render(){
  renderRail();
  $("#main").innerHTML = (V[S.view] || V.home)();
  $("#who").value = S.who || "";
  renderFb(); paintPlaying(); bindFinal();
}
function go(v, anchor){
  S.view = v; save(); render();
  if (anchor){ const el = document.getElementById(anchor); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
  else window.scrollTo({top:0});
}

/* ── 模擬執行 ─────────────────────────────────────── */
let simTimer = null;
function runSim(key, list){
  clearInterval(simTimer);
  S[key] = {state:"running", i:0}; render();
  simTimer = setInterval(() => {
    const s = S[key];
    if (s.state !== "running"){ clearInterval(simTimer); return; }
    s.i++;
    if (s.i >= list.length){ s.state = "done"; S.done[key] = true; clearInterval(simTimer); toast(key==="s1" ? "分析完成（模擬）" : "執行完成（模擬）"); }
    save(); if (S.view === key) render(); else renderRail();
  }, 1100);
}

/* ── 第 7 步播放器 ────────────────────────────────── */
function bindFinal(){
  const a = $("#finalAudio"); if (!a) return;
  a.playbackRate = S.rate || 1;
  const upd = () => { const ph = $("#ph"), tt = $("#plTime"), b = $("#plBtn"); if (!ph) return;
    ph.style.left = (a.currentTime / DUR.final * 100) + "%"; tt.textContent = `${fmt(a.currentTime)} / ${fmt(DUR.final)}`; b.textContent = a.paused ? "播放" : "暫停"; };
  a.addEventListener("timeupdate", upd); a.addEventListener("play", upd); a.addEventListener("pause", upd); a.addEventListener("ended", upd);
  const tl = $("#tl");
  tl.addEventListener("click", e => { if (e.target.closest(".mk")) return; const r = tl.getBoundingClientRect(); a.currentTime = (e.clientX - r.left) / r.width * DUR.final; upd(); });
  tl.addEventListener("keydown", e => { if (e.key==="ArrowRight"){ a.currentTime = Math.min(DUR.final, a.currentTime+2); upd(); } if (e.key==="ArrowLeft"){ a.currentTime = Math.max(0, a.currentTime-2); upd(); } });
}

/* ── 事件 ───────────────────────────────────────── */
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-sel]");
  if (!b) return;
  const d = b.dataset;
  if (d.play){ play(d.play); return; }
  if (d.done){ S.done[d.done] = true; }
  if (d.go){ if (d.act !== "reset") { resetArmed = false; go(d.go, d.anchor); } return; }
  if (d.setupTab){ S.setupTab = d.setupTab; save(); render(); return; }
  if (d.s4Tab){ S.s4Tab = d.s4Tab; S.sel.s4 = 0; save(); render(); return; }
  if (d.rate){ const r = S.tt.ratings[d.rate] || (S.tt.ratings[d.rate] = {}); r[d.ci] = +d.v; save(); render(); return; }
  if (d.choose){ S.tt.chosen = d.choose; S.done.setup = true; save(); render(); toast("已設為老師聲音的預設參考音（樣品）"); return; }
  if (d.spkOk){ S.spk[d.spkOk].ok = !S.spk[d.spkOk].ok; save(); render(); return; }
  if (d.sugg){ const s = S.segs[d.sugg]; s.text = s.text.split(d.a).join(d.b); save(); render(); return; }
  if (d.nameSwap){ const s = S.segs[d.nameSwap]; s.text = s.text.split(d.a).join(d.b); save(); render(); toast(`已換成 ${d.b}`); return; }
  if (d.rv){ const r = S.review[d.rv] || (S.review[d.rv] = {status:"", note:""}); r.status = r.status === d.s ? "" : d.s; save(); render(); return; }
  if (d.rateFinal){ S.rate = +d.rateFinal; save(); render(); return; }
  if (d.seek){ const a = $("#finalAudio"); if (a){ a.currentTime = +d.seek; a.play().catch(()=>{}); } return; }
  if (d.feel){ const dr = S.fbDraft[S.view] || (S.fbDraft[S.view] = {chips:[], note:""}); dr.chips = dr.chips.includes(d.feel) ? dr.chips.filter(x => x!==d.feel) : dr.chips.concat(d.feel); save(); renderFb(); return; }
  if (d.delRm){ S.dels = S.dels.filter(x => x.id !== d.delRm); save(); render(); return; }
  if (d.sel && !e.target.closest("button, input, textarea, select, label")){ S.sel[d.sel] = +d.i; save(); render(); return; }
  switch (d.act){
    case "reset":
      if (!resetArmed){ resetArmed = true; renderRail(); setTimeout(() => { resetArmed = false; renderRail(); }, 4000); return; }
      resetArmed = false; const who = S.who; S = initState(); S.who = who; save(); render(); toast("樣品資料已重設（回饋不受影響）"); return;
    case "reveal": S.tt.revealed = !S.tt.revealed; save(); render(); return;
    case "runS1": runSim("s1", S1_STEPS); return;
    case "runS5": runSim("s5", S5_STEPS); return;
    case "pauseS5": S.s5.state = "idle"; clearInterval(simTimer); save(); render(); toast("已中斷，下次從這裡接著做（模擬）"); return;
    case "addDel": S.dels.push({id:"m"+Date.now(), from:"00:00:00", to:"00:00:00", src:"手動新增", note:"（填時間）"}); save(); render(); return;
    case "importDel": toast("老師的例外清單已匯入（樣品裡已經有這 2 筆）"); return;
    case "toggleFinal": { const a = $("#finalAudio"); if (!a) return; player.pause(); if (a.paused) a.play().catch(()=>{}); else a.pause(); return; }
    case "flag": flagOpen = true; { const a = $("#finalAudio"); if (a) a.pause(); } render(); setTimeout(() => { const n = $("#flagNote"); if (n) n.focus(); }, 0); return;
    case "flagCancel": flagOpen = false; render(); return;
    case "flagSave": { const a = $("#finalAudio"), sec = a ? a.currentTime : 0, note = ($("#flagNote")||{}).value || "";
      S.fixes.push({id:"f"+Date.now(), sec, t:"樣品片段 " + fmt(sec), note}); flagOpen = false; save(); render(); toast("已建立修補項目，會出現在第 6 步"); return; }
    case "export": S.exported = true; S.done.s7 = true; save(); render(); return;
    case "sendFb": sendFb(); return;
    case "toFb": { const f = $("#fb"); if (f){ f.scrollIntoView({behavior:"smooth", block:"start"}); setTimeout(() => { const n = $("#fbNote"); if (n) n.focus({preventScroll:true}); }, 400); } return; }
    case "selectExport": { const ex = $("#exportText"); if (ex){ ex.focus(); ex.select(); try{ navigator.clipboard && navigator.clipboard.writeText(ex.value).then(() => toast("已複製"), () => toast("已全選，按 ⌘C 複製")); }catch(err){ toast("已全選，按 ⌘C 複製"); } } return; }
  }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (t.id === "who"){ S.who = t.value; save(); return; }
  if (d.spk){ S.spk[d.spk].v = t.value; S.spk[d.spk].ok = false; save(); render(); return; }
  if (d.segDone){ S.segs[d.segDone].done = t.checked; save(); render(); return; }
  if (d.segAsk){ S.segs[d.segAsk].ask = t.checked; save(); render(); return; }
  if (d.nameM){ S.names[d.nameM].method = t.value; save(); render(); return; }
  if (d.ovlM){ S.ovl.method = d.ovlM; save(); render(); return; }
  if (d.order){ S.order = t.checked ? S.order.concat(d.order) : S.order.filter(x => x!==d.order); save(); render(); return; }
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.seg){ S.segs[d.seg].text = t.value; save(); return; }
  if (d.ovl){ S.ovl[d.ovl] = t.value; save(); return; }
  if (d.del){ const x = S.dels.find(y => y.id === d.del); if (x) x[d.f] = t.value; save(); return; }
  if (d.rvNote){ (S.review[d.rvNote] || (S.review[d.rvNote] = {status:"redo", note:""})).note = t.value; save(); return; }
  if (t.id === "fbNote"){ (S.fbDraft[S.view] || (S.fbDraft[S.view] = {chips:[], note:""})).note = t.value; save(); return; }
});
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || tag === "select"){ if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const v = S.view;
  const lists = {s3:SEGS, s4:s4Items(), s6:reviewItems()};
  if (!lists[v]) return;
  const n = lists[v].length, i = S.sel[v] || 0;
  const k = e.key;
  if (k === "j" || k === "k"){ S.sel[v] = Math.max(0, Math.min(n-1, i + (k==="j"?1:-1))); save(); render();
    const el = document.querySelector(`[data-sel="${v}"][data-i="${S.sel[v]}"]`); if (el) el.scrollIntoView({block:"nearest"}); e.preventDefault(); return; }
  if (v === "s3"){ const g = SEGS[i];
    if (k === "p"){ play(g.id); e.preventDefault(); }
    if (k === "Enter"){ S.segs[g.id].done = !S.segs[g.id].done; save(); render(); e.preventDefault(); } }
  if (v === "s4"){
    if (k === "p"){ const it = lists.s4[i]; play(it && it.clip); e.preventDefault(); }
    if (k === " "){ e.preventDefault();
      if (S.s4Tab === "names"){ const nm = NAMES[i]; S.names[nm.id].method = S.names[nm.id].method === "name" ? "sentence" : "name"; }
      else if (S.s4Tab === "ovl"){ const ord = OVL_OPTS.map(x => x.v); S.ovl.method = ord[(ord.indexOf(S.ovl.method)+1) % ord.length]; }
      save(); render(); } }
  if (v === "s6"){ const it = lists.s6[i]; if (!it) return;
    if (k === "p"){ play(it.after); e.preventDefault(); }
    if (k === "o"){ play(it.before); e.preventDefault(); }
    if (k === "a" || k === "r"){ const r = S.review[it.id] || (S.review[it.id] = {status:"", note:""}); r.status = k==="a" ? "ok" : "redo"; save(); render(); e.preventDefault(); } }
});

render();
})();
</script>
