#
# 不要手改。改了 requirements.txt 或 constraints.txt 之後，開發者跑「bash update-lock.sh」重產，
# 一起 commit；鎖定檔有變的版本，更新時要重跑 install.sh。
# 產生方式：uv pip compile requirements.txt -c constraints.txt --universal --python-version 3.11
